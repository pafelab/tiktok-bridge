      <ellipse cx="80" cy="141" rx="8" ry="12" fill="#f3c9b6" stroke="#c99483" stroke-width="1.2"/>
      <ellipse cx="178" cy="141" rx="8" ry="12" fill="#f3c9b6" stroke="#c99483" stroke-width="1.2"/>
      <path d="M83 108c7-23 30-29 47-29 26 0 47 13 48 39l-2 29c-3 22-26 40-47 41-21-1-45-20-48-42Z" fill="url(#girl-skin)" stroke="#c79786" stroke-width="1.6"/>

      <!-- Wide dark eyes, a soft smile and the reference's sweeping fringe. -->
      <path d="M91 117q10-5 20-1m35 1q10-4 18 2" fill="none" stroke="#62505a" stroke-width="2.3"/>
      <g class="panda-eye girl-eye">
        <path d="M87 132q12-15 28 0-2 13-14 13-10-1-14-13Z" fill="#fffaf2"/>
        <ellipse cx="103" cy="133" rx="8.5" ry="10" fill="url(#girl-iris)"/>
        <ellipse cx="104" cy="131" rx="4.7" ry="7" fill="#28242d"/>
        <path d="M96 138q6 5 12 0" fill="none" stroke="#c49981" stroke-width="1.6"/>
        <circle cx="99" cy="127" r="3.4" fill="#fffdf5"/><circle cx="107" cy="136" r="1.7" fill="#fffdf5"/>
