<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 235" width="780" height="705" role="img" aria-labelledby="panda-girl-title panda-girl-description">
  <title id="panda-girl-title">Girl in a cozy panda costume</title>
  <desc id="panda-girl-description">An original SVG drawing inspired by the supplied portrait: long black hair, full side-swept bangs covering the forehead, dark eyes, rosy cheeks, a panda-eared hood and waving pink-padded paw mittens. Transparent background; all artwork uses editable vector paths.</desc>
  <style>
    .girl-mouth { transform-origin: 129px 164px; }
    .girl-mouth-happy { transform-origin: 129px 161px; }
    .girl-mouth { animation: smile-lift 3.8s .55s ease-in-out infinite; }
    .girl-mouth-soft { animation: smile-soft 3.8s .55s ease-in-out infinite; }
    .girl-mouth-happy { animation: smile-happy 3.8s .55s ease-in-out infinite; }
    @keyframes smile-lift {
      0%, 12%, 82%, 100% { transform: translateY(0) scale(1); }
      30%, 65% { transform: translateY(-1px) scale(1.025); }
    }
    @keyframes smile-soft {
      0%, 12%, 82%, 100% { opacity: 1; }
      30%, 65% { opacity: 0; }
    }
    @keyframes smile-happy {
      0%, 12%, 82%, 100% { opacity: 0; transform: scale(.9, .75); }
      30%, 65% { opacity: 1; transform: scale(1); }
    }
    @media (prefers-reduced-motion: reduce) {
      .girl-mouth, .girl-mouth-soft, .girl-mouth-happy { animation: none; }
    }
  </style>
  <defs>
    <linearGradient id="girl-skin" x1="0" y1="0" x2=".2" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#fff0e5"/><stop offset="1" stop-color="#f7d3c2"/>
    </linearGradient>
    <linearGradient id="girl-hair" x1="0" y1="0" x2="1" y2=".7" gradientUnits="objectBoundingBox">
      <stop stop-color="#36363f"/><stop offset=".5" stop-color="#23232c"/><stop offset="1" stop-color="#303039"/>
    </linearGradient>
    <linearGradient id="girl-iris" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#302c33"/><stop offset="1" stop-color="#9d7669"/>
    </linearGradient>
  </defs>
  <g id="panda-girl-character" stroke-linecap="round" stroke-linejoin="round">
    <!-- A cozy onesie and black sleeves, tucked behind the gift ticket. -->
    <path d="M79 223c-11-11-16-31-6-47 9-13 29-18 55-18 29 0 46 8 56 25l7 40Z" fill="#303039" stroke="#293b34" stroke-width="2.3"/>
    <path d="M92 177q36-18 70 0l11 47H84Z" fill="#fffdf5" stroke="#293b34" stroke-width="2"/>
    <path d="M108 174v13q20 15 40 0v-13" fill="url(#girl-skin)" stroke="#cc9e8e" stroke-width="1.3"/>
    <path d="m95 178 16 9 17 8 18-8 17-9-6 18-29 9-28-10Z" fill="#e4eadb" stroke="#b8c9af" stroke-width="1.3"/>
    <path d="M129 201v22" fill="none" stroke="#aabca1" stroke-width="1.4"/>
    <rect x="126.5" y="207" width="5" height="7" rx="2" fill="#9eb28f" stroke="#47745b" stroke-width=".8"/>

    <g class="panda-head">
      <!-- Rounded panda ears and a plush hood. -->
      <g class="panda-ear-left">
        <path d="M35 61C15 48 27 16 49 16c24-1 34 25 21 44Z" fill="#303039" stroke="#293b34" stroke-width="2.5"/>
        <path d="M42 49c-12-7-7-20 4-21 12-1 20 11 12 21" fill="#56555f"/>
        <path d="M33 32q3-6 10-8" fill="none" stroke="#77737b" stroke-width="2" opacity=".6"/>
      </g>
      <g>
        <path d="M184 58c-12-24 5-46 27-40 22 6 29 34 11 47Z" fill="#303039" stroke="#293b34" stroke-width="2.5"/>
        <path d="M198 47c-6-12 2-22 11-17 10 4 13 15 4 23" fill="#56555f"/>
      </g>
      <path d="M30 114C24 58 62 27 126 26c62-1 101 33 102 89 0 39-15 66-45 78l-106 1c-32-11-46-39-47-80Z" fill="#fffdf5" stroke="#293b34" stroke-width="2.7"/>
      <path d="M38 121c3 43 18 62 44 68h95c28-9 44-32 44-69 3 44-15 70-39 80H77c-28-11-42-39-39-79Z" fill="#dfe6d7"/>
      <path d="M44 88c8-28 32-45 61-49m55 0q34 10 47 40" fill="none" stroke="#fff" stroke-width="5" opacity=".9"/>
      <!-- Embroidered panda face sits above the hood opening. -->
      <ellipse cx="91" cy="57" rx="12" ry="15" transform="rotate(28 91 57)" fill="#303039"/>
      <ellipse cx="165" cy="57" rx="12" ry="15" transform="rotate(-28 165 57)" fill="#303039"/>
      <path d="m89 54 3-2m69 2 3-2" stroke="#fffdf5" stroke-width="3"/>
      <path d="M120 65q8-5 16 0-1 5-8 8-7-3-8-8Z" fill="#303039"/>
      <path d="M128 73v3m-7 0q3 5 7 0 4 5 7 0" fill="none" stroke="#303039" stroke-width="1.6"/>
      <path d="M53 125c0-40 28-58 76-57 48 0 75 24 75 63 0 33-25 59-74 62-48-1-77-28-77-68Z" fill="#d6dccf" stroke="#c4cebb" stroke-width="1.3"/>

      <!-- Black hair frames the face; separate locks make the motion soft. -->
      <path d="M65 112c0-35 27-46 63-44 46-2 71 22 70 61l-8 61-121 2Z" fill="url(#girl-hair)" stroke="#292932" stroke-width="2"/>
      <g class="girl-hair-left">
        <path d="M70 118c-15 21-12 50-17 69-4 18-12 25-17 26 25 13 48 3 53-17 6-20 2-44-2-66Z" fill="url(#girl-hair)" stroke="#292932" stroke-width="2"/>
        <path d="M69 146c-5 24 1 45-17 59m22-40c0 18-2 30-10 36" fill="none" stroke="#57535e" stroke-width="2" opacity=".65"/>
        <path d="M80 159c-2 26 4 43 15 48-12 4-22-5-26-16" fill="#24242d"/>
      </g>
      <g class="girl-hair-right">
        <path d="M181 116c20 17 23 43 24 64 1 14 4 22 16 29-22 16-50 6-57-14-6-18-1-47 3-65Z" fill="url(#girl-hair)" stroke="#292932" stroke-width="2"/>
        <path d="M188 145c8 24 0 42 17 58m-21-35c1 20 2 28 11 34" fill="none" stroke="#57535e" stroke-width="2" opacity=".65"/>
        <path d="M176 155c3 25-3 42-13 49 11 6 22-4 25-14" fill="#24242d"/>
