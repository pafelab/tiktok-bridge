        <path d="M90 141q12 7 23-1" fill="none" stroke="#a67978" stroke-width="1"/>
      </g>
      <g class="panda-eye girl-eye">
        <path d="M142 132q13-14 28 1-4 12-15 12-10-1-13-13Z" fill="#fffaf2"/>
        <ellipse cx="154" cy="133" rx="8.5" ry="10" fill="url(#girl-iris)"/>
        <ellipse cx="153" cy="131" rx="4.7" ry="7" fill="#28242d"/>
        <path d="M148 138q6 5 12 0" fill="none" stroke="#c49981" stroke-width="1.6"/>
        <circle cx="151" cy="127" r="3.4" fill="#fffdf5"/><circle cx="159" cy="136" r="1.7" fill="#fffdf5"/>
        <path d="M142 132q13-14 28 1m0 0 4-5m-6 2 3-5" fill="none" stroke="#302b34" stroke-width="2.5"/>
        <path d="M144 141q12 7 22 0" fill="none" stroke="#a67978" stroke-width="1"/>
      </g>
      <ellipse class="girl-blush" cx="93" cy="151" rx="11" ry="5.5" fill="#ed9da4" opacity=".5"/>
      <ellipse class="girl-blush" cx="165" cy="151" rx="11" ry="5.5" fill="#ed9da4" opacity=".5"/>
      <path d="m87 150-1 3m6-3-1 3m69-3-1 3m6-3-1 3" fill="none" stroke="#d78794" stroke-width="1" opacity=".65"/>
      <path d="m129 143-2 7q3 3 6 0" fill="none" stroke="#cd9d8c" stroke-width="1.3"/>
      <g class="girl-mouth">
        <g class="girl-mouth-soft">
          <path d="M118 161q6-4 11-1 5-3 12 0-5 10-12 10-7 0-11-9Z" fill="#c77884"/>
          <path d="M120 162q9 3 19-1" fill="none" stroke="#954f65" stroke-width="1.2"/>
          <path d="M125 167q5 2 9-1" fill="none" stroke="#f5b7ba" stroke-width="1.6"/>
        </g>
        <g class="girl-mouth-happy" opacity="0">
          <path d="M115 160Q129 166 143 160C142 169 136 175 129 175S116 169 115 160Z" fill="#a85e73" stroke="#954f65" stroke-width="1"/>
          <path d="M118 162Q129 166 140 162L138 166Q129 169 120 166Z" fill="#fffdf5"/>
          <path d="M122 172Q129 167 136 172Q129 175 122 172Z" fill="#efacb6"/>
        </g>
      </g>

      <!-- Full forehead-covering bangs sweep from the left crown toward the right cheek. -->
      <path d="M69 125C63 95 78 75 107 71 134 64 172 72 185 95 194 112 194 133 188 151L178 143C180 133 178 122 174 117 173 126 163 130 153 127 140 123 127 114 119 105 121 113 126 119 131 122 118 123 106 116 99 109 94 103 93 94 94 85 80 97 81 119 85 139L78 151Z" fill="url(#girl-hair)" stroke="#292932" stroke-width="1.8"/>
      <path d="M101 78C100 96 110 111 122 117M110 76C113 96 136 116 156 122M120 76C130 96 147 111 164 116M134 79C150 88 161 98 168 108M79 107Q73 127 78 140M186 114Q190 127 187 138" fill="none" stroke="#5d5965" stroke-width="2" opacity=".65"/>
      <path d="M108 83Q112 97 125 108M122 83Q131 97 142 103" fill="none" stroke="#8b8290" stroke-width="1.5" opacity=".38"/>
      <!-- Short cheek-framing pieces sit in front of the longer hair. -->
      <path d="M76 121c-1 26 3 42 16 53-15 0-23-12-23-31Zm105 0c5 23-1 40-12 51 15-3 22-15 20-34Z" fill="#292932"/>
    </g>

    <!-- Mint bow and tiny bamboo embroidery on the panda onesie. -->
    <g class="girl-bow" stroke="#47745b" stroke-width="1.2">
      <path d="M126 194c-19-15-24-5-17 6l17-3m6-3c19-15 24-5 17 6l-17-3" fill="#aacd99"/>
      <path d="m126 198-8 10 9-3 2-7m3 0 7 10 1-7-7-4" fill="#c1dbaa"/>
      <ellipse cx="129" cy="195" rx="4" ry="4.5" fill="#dcefd9"/>
    </g>
    <path d="M151 211c-1 5-3 7-6 10m4-5c-7 1-9-4-9-4s7-1 9 4Zm1-3c-1-6 5-8 5-8s2 5-5 8Z" fill="#9dbf89" stroke="#47745b" stroke-width="1"/>

    <!-- Oversized panda mittens: one rests on the card, one waves hello. -->
    <g class="panda-wave">
      <path d="m184 194 10-22 23 9-9 22Z" fill="#fffdf5" stroke="#293b34" stroke-width="2"/>
      <path d="M184 173c-5-12 2-22 10-31-1-12 3-20 9-19 6 0 8 7 8 12 12-7 24 3 24 16 1 14-11 29-23 37-13 6-23-3-28-15Z" fill="#303039" stroke="#293b34" stroke-width="2.3"/>
      <ellipse cx="210" cy="160" rx="11" ry="12" transform="rotate(23 210 160)" fill="#e9a6b7"/>
      <ellipse cx="199" cy="143" rx="4" ry="5" transform="rotate(12 199 143)" fill="#e9a6b7"/>
      <ellipse cx="212" cy="140" rx="4" ry="5" transform="rotate(20 212 140)" fill="#e9a6b7"/>
      <ellipse cx="223" cy="146" rx="4" ry="5" transform="rotate(35 223 146)" fill="#e9a6b7"/>
      <path d="m206 157 2-3m-15 37 13 6" stroke="#fffdf5" stroke-width="2" opacity=".55"/>
    </g>
    <g class="panda-paw">
      <path d="M66 194q16-10 31 2l-1 15-31-1Z" fill="#fffdf5" stroke="#293b34" stroke-width="2"/>
      <path d="M58 207c0-12 13-17 28-14 17 2 24 11 20 22-4 10-17 14-29 12-14-2-21-10-19-20Z" fill="#303039" stroke="#293b34" stroke-width="2"/>
      <path d="m70 215 1 5m11-4v6m11-7-1 5" stroke="#74707a" stroke-width="2"/>
      <path d="M67 202q8-5 16-3" fill="none" stroke="#66616d" stroke-width="2" opacity=".6"/>
    </g>
  </g>
</svg>
